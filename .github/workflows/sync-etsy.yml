name: Sync Etsy listings

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Etsy sync configuration
        id: config
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
        run: |
          if [ -n "$ETSY_KEYSTRING" ] && [ -n "$ETSY_ACCESS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Etsy API secrets are not configured yet; skipping sync."
          fi

      - name: Pull listings from Etsy
        if: steps.config.outputs.enabled == 'true'
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: node scripts/sync-etsy.mjs

      - name: Commit if anything changed
        if: steps.config.outputs.enabled == 'true'
        run: |
          git config user.name "etsy-sync"
          git config user.email "actions@github.com"
          git add src/data/etsy-listings.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Sync Etsy listings"
            git push
          fi
